<div class="page-header">
  <h1>Courses</h1>
  <a mat-flat-button routerLink="/courses/new">Add Course</a>
</div>

<mat-form-field appearance="outline" class="search-field">
  <mat-label>Search by code or name</mat-label>
  <input [formControl]="search" matInput placeholder="e.g. CS101"/>
</mat-form-field>

@if (loading()) {
  <div class="spinner-wrap">
    <mat-spinner diameter="36"/>
  </div>
} @else if (courses().length === 0) {
  <p class="empty-state">No courses found</p>
} @else {
  <table [dataSource]="courses()" class="mat-elevation-z1" mat-table>
    <ng-container matColumnDef="courseCode">
      <th *matHeaderCellDef mat-header-cell>Code</th>
      <td *matCellDef="let course" mat-cell>
        <a [routerLink]="['/courses', course.id]">{{ course.courseCode }}</a>
      </td>
    </ng-container>

    <ng-container matColumnDef="courseName">
      <th *matHeaderCellDef mat-header-cell>Course Name</th>
      <td *matCellDef="let course" mat-cell>{{ course.courseName }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th *matHeaderCellDef mat-header-cell>Description</th>
      <td *matCellDef="let course" mat-cell>{{ course.description }}</td>
    </ng-container>

    <ng-container matColumnDef="students">
      <th *matHeaderCellDef mat-header-cell>Students</th>
      <td *matCellDef="let course" mat-cell>{{ course.students.length }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th *matHeaderCellDef mat-header-cell></th>
      <td *matCellDef="let course" mat-cell>
        <a [routerLink]="['/courses', course.id]" aria-label="View course" mat-icon-button>
          <mat-icon>visibility</mat-icon>
        </a>
        <a [routerLink]="['/courses', course.id, 'edit']" aria-label="Edit course" mat-icon-button>
          <mat-icon>edit</mat-icon>
        </a>
        <button (click)="deleteCourse(course)" aria-label="Delete course" mat-icon-button>
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr *matHeaderRowDef="displayedColumns" mat-header-row></tr>
    <tr *matRowDef="let row; columns: displayedColumns" mat-row></tr>
  </table>
}
